[project]
name = "dasvo"
version = "0.1.0"
description = "DASVO"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Andrii Polukhin", email = "pandrii000@gmail.com" },
]
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.43.4",
    "evo>=1.25.0",
    "fire>=0.7.1",
    "huggingface-hub>=1.13.0",
    "ipykernel>=7.2.0",
    "jinja2>=3.1.6",
    "kagglehub>=1.0.1",
    "loguru>=0.7.3",
    "matplotlib>=3.7.0",
    "numpy>=1.24.0",
    "opencv-python>=4.8.0",
    "pydantic>=2.13.4",
    "pytest>=9.0.3",
    "pyyaml>=6.0.3",
    "scipy>=1.10.0",
    "tabulate>=0.10.0",
    "tqdm>=4.65.0",
]

[project.urls]
Homepage = "https://github.com/pandrii000/dasvo"
Paper = "https://doi.org/10.3390/robotics15070128"
Dataset = "https://www.kaggle.com/datasets/pandrii000/dasvo-tartanair-rgb-d-validation-split"
Source = "https://github.com/pandrii000/dasvo"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["dasvo"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
